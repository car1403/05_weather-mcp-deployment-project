name: MCP Server CI

on:
  push:
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp-server-ci.yml"
  pull_request:
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp-server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp_server/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Test MCP server
        run: python -m pytest tests -q

      - name: Prepare CI environment file
        run: cp config/.env.docker.example config/.env.docker

      - name: Validate Compose
        run: docker compose -f deploy/compose.yml config --quiet

      - name: Build MCP server image
        run: docker compose -f deploy/compose.yml build
