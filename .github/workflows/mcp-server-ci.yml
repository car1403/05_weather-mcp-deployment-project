name: MCP Server CI CD

on:
  push:
    branches: [main]
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp-server-ci.yml"
  pull_request:
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp-server-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy MCP server to mcp_server"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcp-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp_server/requirements/*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
      - name: Test MCP server
        run: python -m pytest tests/test_server.py -q
      - name: Prepare CI environment file
        run: cp config/.env.docker.example config/.env.docker
      - name: Validate Compose
        run: docker compose -f deploy/compose.yml config --quiet
      - name: Build MCP server image
        run: docker compose -f deploy/compose.yml build

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: mcp_server
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy MCP server source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/mcp_server'
          scp -r mcp_server/. "$AWS_USER@$AWS_HOST:~/mcp_server/"
      - name: Deploy MCP server and verify health
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/mcp_server && test -f config/.env.docker && docker compose -f deploy/compose.yml config --quiet && docker compose -f deploy/compose.yml up -d --build && curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8010/health'
